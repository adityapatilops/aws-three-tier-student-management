<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <div class="form-box">

            <h2>Add Student</h2>

            <form action="/add" method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    name="course"
                    placeholder="Course"
                    required
                >

                <button type="submit">
                    Add Student
                </button>

            </form>

        </div>

        <div class="students">

            <h2>Students</h2>

            {% if students %}

                <table>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Action</th>
                    </tr>

                    {% for student in students %}

                    <tr>

                        <td>{{ student.id }}</td>

                        <td>{{ student.name }}</td>

                        <td>{{ student.email }}</td>

                        <td>{{ student.course }}</td>

                        <td>
                            <a href="/delete/{{ student.id }}">
                                Delete
                            </a>
                        </td>

                    </tr>

                    {% endfor %}

                </table>

            {% else %}

                <p>No students found.</p>

            {% endif %}

        </div>

    </div>

</body>
</html>
